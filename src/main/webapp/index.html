<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bodega de Productos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <h1>Bodega de Productos</h1>
        <p>Registro, consulta y ubicación de productos por estante</p>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h2 id="tituloFormulario">Registrar producto</h2>
            <form id="formularioProducto" autocomplete="off" novalidate>
                <input type="hidden" id="id">
                <div class="campos">
                    <div class="campo">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" maxlength="30" placeholder="Ej: P-007" required>
                    </div>
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" maxlength="100" placeholder="Nombre del producto" required>
                    </div>
                    <div class="campo">
                        <label for="cantidad">Cantidad</label>
                        <input type="number" id="cantidad" min="0" step="1" placeholder="0" required>
                    </div>
                    <div class="campo">
                        <label for="estante">Estante</label>
                        <input type="text" id="estante" maxlength="30" placeholder="Ej: Estante A1" required>
                    </div>
                </div>
                <div class="acciones">
                    <button type="button" id="btnGuardar" class="boton primario">Guardar</button>
                    <button type="button" id="btnEditar" class="boton secundario" disabled>Editar</button>
                    <button type="button" id="btnCancelar" class="boton neutro">Cancelar</button>
                </div>
            </form>
            <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
        </section>

        <section class="tarjeta">
            <h2>Productos registrados</h2>
            <div class="busqueda">
                <input type="text" id="terminoBusqueda" placeholder="Buscar por código o nombre">
                <button type="button" id="btnBuscar" class="boton primario">Buscar</button>
                <button type="button" id="btnVerTodos" class="boton neutro">Ver Todos</button>
            </div>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Cantidad disponible</th>
                            <th>Estante</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
